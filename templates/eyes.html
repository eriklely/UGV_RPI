<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Eyes</title>
  <script src="/socket.io.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a0c;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .stage {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7vw;
    }
    .eye {
      width: 38vw;
      height: 72vh;
      max-height: 280px;
      background: #f4f1ea;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 -10px 18px rgba(0,0,0,0.18),
        0 0 0 6px #111,
        0 12px 28px rgba(0,0,0,0.55);
    }
    .iris {
      width: 46%;
      height: 46%;
      border-radius: 50%;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 35% 30%, #5ad0ff 0%, #1a6cff 42%, #0b2a6b 100%);
    }
    .pupil {
      width: 42%; height: 42%;
      background: #09090b;
      border-radius: 50%;
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
    }
    .glint {
      width: 18%; height: 18%;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      left: 28%; top: 24%;
    }
    .lid {
      position: absolute; left: 0; right: 0;
      height: 50%;
      background: #0a0a0c;
      z-index: 5;
    }
    .lid.top { top: 0; transform-origin: top; transform: scaleY(0.08); }
    .lid.bot { bottom: 0; transform-origin: bottom; transform: scaleY(0.08); }
    .eye.blink .lid.top,
    .eye.blink .lid.bot { animation: blinkShut 0.16s ease-in-out; }
    @keyframes blinkShut {
      0%   { transform: scaleY(0.08); }
      45%  { transform: scaleY(1); }
      100% { transform: scaleY(0.08); }
    }
    .dot {
      position: fixed; top: 8px; right: 10px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; z-index: 10;
    }
    .dot.on { background: #3ddc84; }
    .hud {
      position: fixed; bottom: 8px; left: 0; right: 0;
      text-align: center; z-index: 10;
    }
    .hud button {
      font-size: 14px;
      padding: 6px 12px;
      margin: 0 4px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div class="dot" id="dot"></div>
  <div class="stage" id="stage">
    <div class="eye" id="eyeL">
      <div class="lid top"></div>
      <div class="iris" id="irisL"><div class="pupil"></div><div class="glint"></div></div>
      <div class="lid bot"></div>
    </div>
    <div class="eye" id="eyeR">
      <div class="lid top"></div>
      <div class="iris" id="irisR"><div class="pupil"></div><div class="glint"></div></div>
      <div class="lid bot"></div>
    </div>
  </div>
  <div class="hud">
    <button type="button" onclick="look(-1,0)">Left</button>
    <button type="button" onclick="look(0,0)">Center</button>
    <button type="button" onclick="look(1,0)">Right</button>
    <button type="button" onclick="doBlink()">Blink</button>
  </div>
  <script>
    var x = 0, y = 0, targetX = 0, targetY = 0;
    var liveUntil = 0;
    var irisL = document.getElementById('irisL');
    var irisR = document.getElementById('irisR');
    var eyes = [document.getElementById('eyeL'), document.getElementById('eyeR')];
    var dot = document.getElementById('dot');

    function clamp(v, a, b) {
      return v < a ? a : (v > b ? b : v);
    }

    function applyGaze() {
      // Percent of iris size so travel scales with the large eyes.
      var tx = 'translate(calc(-50% + ' + (x * 100) + '%), calc(-50% + ' + (y * 100) + '%))';
      irisL.style.transform = tx;
      irisR.style.transform = tx;
    }

    function look(nx, ny) {
      targetX = nx;
      targetY = typeof ny === 'number' ? ny : 0;
      liveUntil = Date.now() + 800;
    }

    function doBlink() {
      eyes[0].classList.remove('blink');
      eyes[1].classList.remove('blink');
      void eyes[0].offsetWidth;
      eyes[0].classList.add('blink');
      eyes[1].classList.add('blink');
    }

    function tick() {
      x += (targetX - x) * 0.18;
      y += (targetY - y) * 0.18;
      applyGaze();
      requestAnimationFrame(tick);
    }
    tick();

    setInterval(function () {
      if (Math.random() < 0.35) doBlink();
    }, 2200);

    setInterval(function () {
      if (Date.now() < liveUntil) return;
      if (Math.random() < 0.55) {
        targetX = (Math.random() * 2 - 1) * 0.85;
        targetY = (Math.random() * 2 - 1) * 0.35;
      } else {
        targetX = 0; targetY = 0;
      }
    }, 2600);

    document.getElementById('stage').addEventListener('click', function (e) {
      var mid = window.innerWidth / 2;
      look(e.clientX < mid ? -1 : 1, 0);
    });

    function setGazeFromAngles(pan, tilt) {
      pan = Number(pan) || 0;
      tilt = Number(tilt) || 0;
      look(clamp(pan / 90, -1, 1), clamp(-tilt / 45, -1, 1));
    }
    
    function pullGaze() {
      var req = new XMLHttpRequest();
      req.open('GET', '/gaze.json?t=' + Date.now(), true);
      req.onreadystatechange = function () {
        if (req.readyState === 4 && req.status === 200) {
          try {
            var d = JSON.parse(req.responseText);
            setGazeFromAngles(d.pan, d.tilt);
            dot.className = 'dot on';
          } catch (e) {}
        }
      };
      req.send(null);
    }
    setInterval(pullGaze, 150);
    pullGaze();
    
    try {
      var sock = io('http://' + location.host + '/ctrl');
      sock.on('connect', function () { dot.className = 'dot on'; });
      sock.on('gaze', function (d) { setGazeFromAngles(d.pan, d.tilt); });
      sock.on('update', function (data) {
        var pan = data[109] !== undefined ? data[109] : data['109'];
        var tilt = data[110] !== undefined ? data[110] : data['110'];
        if (typeof pan === 'number' || typeof tilt === 'number') {
          setGazeFromAngles(pan, tilt);
        }
      });
    } catch (err) {}
  </script>
</body>
</html>
