<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Eyes</title>
  <script src="/socket.io.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0a0c;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    .stage {
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10vw;
      padding: 0 4vw 72px;
      box-sizing: border-box;
    }
    .eye {
      --gx: 0%;
      --gy: 0%;
      --ox: 0%;
      --rot: 0deg;
      width: 32vw;
      height: 36vh;
      max-width: 140px;
      max-height: 180px;
      background: #041018;
      border-radius: 28%;
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
      transform: translate(calc(var(--gx) + var(--ox)), var(--gy)) rotate(var(--rot));
      transition: border-radius 0.22s ease, transform 0.08s linear;
    }
    .core {
      position: absolute;
      inset: 6%;
      background: radial-gradient(circle at 32% 28%, #b9f6ff 0%, #2ee6ff 28%, #00b7ff 68%, #0077ff 100%);
      border-radius: 22%;
      box-shadow:
        0 0 18px #00e5ff,
        0 0 42px #0090ff,
        inset 0 0 14px rgba(255,255,255,0.85);
      transform-origin: center;
    }
    .lid {
      position: absolute; left: 0; right: 0;
      height: 50%;
      background: #0a0a0c;
      z-index: 5;
      pointer-events: none;
      transition: transform 0.22s ease;
    }
    .lid.top { top: 0; transform-origin: top; transform: scaleY(0); }
    .lid.bot { bottom: 0; transform-origin: bottom; transform: scaleY(0); }
    .eye.blink .core {
      animation: squint 0.16s ease-in-out;
    }
    @keyframes squint {
      0%   { transform: scaleY(1); }
      45%  { transform: scaleY(0.12); }
      100% { transform: scaleY(1); }
    }

    /* FluxGarage-style moods via #stage class */
    .mood-angry .eye {
      border-radius: 40% 40% 12% 12%;
    }
    .mood-angry .eyeL { --rot: -11deg; }
    .mood-angry .eyeR { --rot: 11deg; }
    .mood-happy .lid.bot { transform: scaleY(0.45); }
    .mood-tired .lid.top { transform: scaleY(0.42); }
    .mood-tired .lid.bot { transform: scaleY(0.28); }
    .mood-confused .eyeL { --ox: -10%; }
    .mood-confused .eyeR { --ox: 10%; }

    .dot {
      position: fixed; top: 8px; right: 10px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #444; z-index: 10;
    }
    .dot.on { background: #3ddc84; }
    .hud {
      position: fixed; bottom: 8px; left: 0; right: 0;
      text-align: center; z-index: 10;
    }
    .hud button {
      font-size: 14px;
      padding: 6px 12px;
      margin: 3px 4px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: #ddd;
    }
    .hud button.active { background: #3a5cff; color: #fff; }

    @media (max-width: 400px) {
      .stage {
        gap: 14vw;
        padding: 0 3vw 88px;
      }
      .eye {
        width: 34vw;
        height: 30vh;
        max-width: 118px;
        max-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="dot" id="dot"></div>
  <div class="stage" id="stage">
    <div class="eye eyeL" id="eyeL">
      <div class="lid top"></div>
      <div class="core" id="irisL"></div>
      <div class="lid bot"></div>
    </div>
    <div class="eye eyeR" id="eyeR">
      <div class="lid top"></div>
      <div class="core" id="irisR"></div>
      <div class="lid bot"></div>
    </div>
  </div>
  <div class="hud">
    <button type="button" onclick="look(-1,0)">Left</button>
    <button type="button" onclick="look(0,0)">Center</button>
    <button type="button" onclick="look(1,0)">Right</button>
    <button type="button" onclick="doBlink()">Blink</button>
    <br>
    <button type="button" data-mood="default" class="active" onclick="setMood('default')">Default</button>
    <button type="button" data-mood="angry" onclick="setMood('angry')">Angry</button>
    <button type="button" data-mood="happy" onclick="setMood('happy')">Happy</button>
    <button type="button" data-mood="tired" onclick="setMood('tired')">Tired</button>
    <button type="button" data-mood="confused" onclick="setMood('confused')">Confused</button>
  </div>
  <script>
    var x = 0, y = 0, targetX = 0, targetY = 0;
    var liveUntil = 0;
    var mood = 'default';
    var irisL = document.getElementById('irisL');
    var irisR = document.getElementById('irisR');
    var eyeL = document.getElementById('eyeL');
    var eyeR = document.getElementById('eyeR');
    var eyes = [eyeL, eyeR];
    var stage = document.getElementById('stage');
    var dot = document.getElementById('dot');

    function clamp(v, a, b) {
      return v < a ? a : (v > b ? b : v);
    }

    function applyGaze() {
      var gx = (x * 18) + '%';
      var gy = (y * 14) + '%';
      eyeL.style.setProperty('--gx', gx);
      eyeL.style.setProperty('--gy', gy);
      eyeR.style.setProperty('--gx', gx);
      eyeR.style.setProperty('--gy', gy);
    }

    function look(nx, ny) {
      targetX = nx;
      targetY = typeof ny === 'number' ? ny : 0;
      liveUntil = Date.now() + 800;
    }

    function setMood(name) {
      mood = name || 'default';
      stage.className = mood === 'default' ? 'stage' : 'stage mood-' + mood;
      var buttons = document.querySelectorAll('.hud button[data-mood]');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('active', buttons[i].getAttribute('data-mood') === mood);
      }
    }

    function doBlink() {
      eyes[0].classList.remove('blink');
      eyes[1].classList.remove('blink');
      void eyes[0].offsetWidth;
      eyes[0].classList.add('blink');
      eyes[1].classList.add('blink');
    }

    function tick() {
      x += (targetX - x) * 0.18;
      y += (targetY - y) * 0.18;
      applyGaze();
      requestAnimationFrame(tick);
    }
    tick();

    setInterval(function () {
      if (Math.random() < 0.35) doBlink();
    }, 2200);

    setInterval(function () {
      if (Date.now() < liveUntil) return;
      if (Math.random() < 0.55) {
        targetX = (Math.random() * 2 - 1) * 0.85;
        targetY = (Math.random() * 2 - 1) * 0.35;
      } else {
        targetX = 0; targetY = 0;
      }
    }, 2600);

    document.getElementById('stage').addEventListener('click', function (e) {
      var mid = window.innerWidth / 2;
      look(e.clientX < mid ? -1 : 1, 0);
    });

    function setGazeFromAngles(pan, tilt) {
      pan = Number(pan) || 0;
      tilt = Number(tilt) || 0;
      look(clamp(pan / 90, -1, 1), clamp(-tilt / 45, -1, 1));
    }
    
    function pullGaze() {
      var req = new XMLHttpRequest();
      req.open('GET', '/gaze.json?t=' + Date.now(), true);
      req.onreadystatechange = function () {
        if (req.readyState === 4 && req.status === 200) {
          try {
            var d = JSON.parse(req.responseText);
            setGazeFromAngles(d.pan, d.tilt);
            dot.className = 'dot on';
          } catch (e) {}
        }
      };
      req.send(null);
    }
    setInterval(pullGaze, 150);
    pullGaze();
    
    try {
      var sock = io('http://' + location.host + '/ctrl');
      sock.on('connect', function () { dot.className = 'dot on'; });
      sock.on('gaze', function (d) { setGazeFromAngles(d.pan, d.tilt); });
      sock.on('update', function (data) {
        var pan = data[109] !== undefined ? data[109] : data['109'];
        var tilt = data[110] !== undefined ? data[110] : data['110'];
        if (typeof pan === 'number' || typeof tilt === 'number') {
          setGazeFromAngles(pan, tilt);
        }
      });
    } catch (err) {}
  </script>
</body>
</html>
